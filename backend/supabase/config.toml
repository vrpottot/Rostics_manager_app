# Конфиг Supabase CLI — используется для локальной разработки (`supabase start`)
# и как источник миграций для self-hosted инстанса (`supabase db push --db-url ...`).

project_id = "rostics-manager"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "rostics://"
additional_redirect_urls = ["rostics://"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
enable_signup = true

[auth.email]
enable_signup = true
# менеджер входит сразу после регистрации, без подтверждения почты
enable_confirmations = false

[realtime]
enabled = true
